[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmodal_mcp"
version = "0.2.0"
description = "MCP server mirror for the vmodal SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vmodal>=1.0.0,<2.0.0",
  "mcp>=1.2.0",
  "fire>=0.6.0",
]

[project.scripts]
vmodal-mcp = "src.mcp_server.main_mcp:cli"

[tool.setuptools]
packages = [
  "src",
  "src.utils",
  "src.mcp_server",
]

[tool.setuptools.package-dir]
src = "src"
"src.utils" = "src/utils"
"src.mcp_server" = "src/mcp_server"
